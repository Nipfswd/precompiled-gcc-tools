
name: Build Latest GCC

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    name: Build GCC (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PREFIX: /opt/gcc-latest
      MAKEFLAGS: -j2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            texinfo \
            wget \
            curl \
            python3 \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            libisl-dev \
            libzstd-dev

      - name: Build latest GCC
        id: gcc
        run: |
          chmod +x scripts/build-gcc.sh
          bash scripts/build-gcc.sh

      - name: Package GCC
        run: |
          VERSION="${{ steps.gcc.outputs.version }}"

          sudo tar -C /opt \
            -cJf "$GITHUB_WORKSPACE/gcc-${VERSION}-linux-x86_64.tar.xz" \
            gcc-latest

          sudo chown "$USER:$USER" \
            "$GITHUB_WORKSPACE/gcc-${VERSION}-linux-x86_64.tar.xz"

          sha256sum \
            "gcc-${VERSION}-linux-x86_64.tar.xz" \
            > SHA256SUMS

      - name: Upload GCC artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ steps.gcc.outputs.version }}-linux-x86_64
          path: |
            gcc-*.tar.xz
            SHA256SUMS
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Build GCC (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-mpc
            mingw-w64-x86_64-isl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            flex
            bison
            texinfo
            curl
            wget
            tar
            unzip
            zip

      - name: Build GCC for Windows
        id: gcc
        env:
          PREFIX: /mingw64/gcc-latest
          MAKEFLAGS: -j2
        run: |
          bash scripts/build-gcc-windows.sh

      - name: Package GCC
        run: |
          VERSION="${{ steps.gcc.outputs.version }}"

          cd /mingw64
          zip -qr "$GITHUB_WORKSPACE/gcc-${VERSION}-windows-x86_64.zip" gcc-latest

          cd "$GITHUB_WORKSPACE"
          sha256sum "gcc-${VERSION}-windows-x86_64.zip" > SHA256SUMS-windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ steps.gcc.outputs.version }}-windows-x86_64
          path: |
            gcc-*-windows-x86_64.zip
            SHA256SUMS-windows
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
