name: Build Latest GCC

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    name: Build GCC (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PREFIX: /opt/gcc-latest
      MAKEFLAGS: -j2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            texinfo \
            wget \
            curl \
            python3 \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            libisl-dev \
            libzstd-dev

      - name: Build latest GCC
        id: gcc
        run: |
          chmod +x scripts/build-gcc.sh
          bash scripts/build-gcc.sh

      - name: Package GCC
        run: |
          VERSION="${{ steps.gcc.outputs.version }}"

          sudo tar -C /opt \
            -cJf "$GITHUB_WORKSPACE/gcc-${VERSION}-linux-x86_64.tar.xz" \
            gcc-latest

          sudo chown "$USER:$USER" \
            "$GITHUB_WORKSPACE/gcc-${VERSION}-linux-x86_64.tar.xz"

          sha256sum \
            "gcc-${VERSION}-linux-x86_64.tar.xz" \
            > SHA256SUMS

      - name: Upload GCC artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ steps.gcc.outputs.version }}-linux-x86_64
          path: |
            gcc-*.tar.xz
            SHA256SUMS
          retention-days: 30
          compression-level: 0
          if-no-files-found: error